name: Agent de veille

on:
  schedule:
    # Lundi (1) et jeudi (4) à 6h17 UTC, soit 7h17 à Paris en hiver et 8h17 en été
    - cron: "17 6 * * 1,4"
  # Permet de lancer l'agent à la main depuis GitHub
  workflow_dispatch:

# Autorise le workflow à committer historique.json
permissions:
  contents: write

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer l'agent
        run: python agent.py
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GEMINI_MODEL_SECOURS: ${{ secrets.GEMINI_MODEL_SECOURS }}
          GEMINI_MODEL_SECOURS_2: ${{ secrets.GEMINI_MODEL_SECOURS_2 }}
          GMAIL_ADRESSE: ${{ secrets.GMAIL_ADRESSE }}
          GMAIL_MOT_DE_PASSE_APP: ${{ secrets.GMAIL_MOT_DE_PASSE_APP }}
          MAIL_DESTINATAIRE: ${{ secrets.MAIL_DESTINATAIRE }}

      - name: Sauvegarder la mémoire
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historique.json
          git diff --staged --quiet || git commit -m "Mise à jour de la mémoire de veille"
          git push
